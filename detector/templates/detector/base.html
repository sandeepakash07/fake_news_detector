<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Fake News Detector{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                    },
                    colors: {
                        primary: '#1e40af',
                        secondary: '#6366f1',
                        danger: '#dc2626',
                        success: '#16a34a',
                        muted: '#6b7280',
                    }
                }
            }
        };
    </script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Custom Utility Classes -->
    <style type="text/tailwindcss">
        @layer utilities {
            .btn {
                @apply py-2 px-4 rounded font-semibold text-sm transition duration-200;
            }
            .btn-primary {
                @apply bg-primary text-white hover:bg-blue-800;
            }
            .btn-danger {
                @apply bg-danger text-white hover:bg-red-700;
            }
            .btn-success {
                @apply bg-success text-white hover:bg-green-700;
            }
            .card {
                @apply bg-white rounded-lg shadow-md p-6;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-primary py-2 text-white shadow">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'detector:index' %}" class="text-xl font-bold">🕵️‍♂️ Fake News Detector</a>
            <div class="space-x-6">
                <a href="{% url 'detector:index' %}" class="hover:text-gray-300">Home</a>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="flex-grow container mx-auto px-6 py-8">
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-4 rounded 
                        {% if message.tags == 'error' %}
                            bg-red-100 text-red-800
                        {% elif message.tags == 'success' %}
                            bg-green-100 text-green-800
                        {% else %}
                            bg-blue-100 text-blue-800
                        {% endif %}
                    ">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-12">
        <div class="container mx-auto px-6 py-6 text-center text-sm">
            <p>© {% now "Y" %} Fake News Detector.</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
